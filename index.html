<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140A2E">
  <title>MESSENG-AR Courier</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    /* ================= SYSTEM AUDIO SPASIAL & WORKER GLOBAL ================= */
    window.globalTTSWorker = null;
    window.isWorkerReady = false;

    const workerCode = `
      import { KokoroTTS } from "https://esm.sh/kokoro-js";
      let kokoroModel = null;

      self.onmessage = async (event) => {
        const { action, text, voice } = event.data;

        if (action === 'init') {
          try {
            kokoroModel = await KokoroTTS.from_pretrained("hexgrad/Kokoro-82M", { device: "webgpu", dtype: "q8" });
            self.postMessage({ status: 'ready', mode: 'WebGPU' });
          } catch (e) {
            try {
              kokoroModel = await KokoroTTS.from_pretrained("hexgrad/Kokoro-82M", { device: "wasm", dtype: "q8" });
              self.postMessage({ status: 'ready', mode: 'WASM' });
            } catch (err) {
              self.postMessage({ status: 'error', error: err.message });
            }
          }
        }

        if (action === 'generate') {
          if (!kokoroModel) return self.postMessage({ status: 'error', error: "Model belum siap" });
          try {
            const audioData = await kokoroModel.generate(text, { voice: voice, speed: 1.0 });
            self.postMessage({ status: 'done', pcmData: audioData.wav.buffer, sampleRate: 24000 }, [audioData.wav.buffer]);
          } catch (err) {
            self.postMessage({ status: 'error', error: err.message });
          }
        }
      };
    `;

    try {
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      window.globalTTSWorker = new Worker(URL.createObjectURL(blob), { type: 'module' });
      window.globalTTSWorker.postMessage({ action: 'init' });

      window.globalTTSWorker.onmessage = (e) => {
        if (e.data.status === 'ready') {
          window.isWorkerReady = true;
          console.log("Worker AI TTS Siap:", e.data.mode);
        }
      };
    } catch(e) { console.error("Worker gagal:", e); }

    /* ================= KOMPONEN CUSTOM A-FRAME: SPATIAL-TTS ================= */
    AFRAME.registerComponent('spatial-tts', {
      schema: {
        refDistance: { type: 'number', default: 1 },
        maxDistance: { type: 'number', default: 10 },
        rolloffFactor: { type: 'number', default: 1 }
      },

      init: function () {
        this.sound = null;
        this.listener = null;
        this.audioCtx = null;

        const setup = () => {
          const camera = this.el.sceneEl.camera;
          if (camera && !this.listener) {
            this.listener = new THREE.AudioListener();
            camera.add(this.listener);

            this.sound = new THREE.PositionalAudio(this.listener);
            this.sound.setRefDistance(this.data.refDistance);
            this.sound.setMaxDistance(this.data.maxDistance);
            this.sound.setRolloffFactor(this.data.rolloffFactor);
            this.sound.setDistanceModel('linear');

            this.el.object3D.add(this.sound);
            this.audioCtx = this.listener.context;
          }
        };

        this.el.sceneEl.addEventListener('render-target-loaded', setup);
        this.el.sceneEl.addEventListener('loaded', setup);
      },

      playWorkerAudio: function (pcmArrayBuffer, onEndedCallback) {
        if (!this.sound || !this.audioCtx) {
          if (onEndedCallback) onEndedCallback();
          return;
        }

        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }

        let hasFinished = false;
        const safeCallback = () => {
          if (!hasFinished) {
            hasFinished = true;
            if (onEndedCallback) onEndedCallback();
          }
        };

        const fallbackTimer = setTimeout(() => {
          console.warn("Audio playback timeout, forcing UI update.");
          safeCallback();
        }, 8000);

        this.audioCtx.decodeAudioData(pcmArrayBuffer, (buffer) => {
          if (this.sound.isPlaying) this.sound.stop();

          this.sound.setBuffer(buffer);
          this.sound.play();

          const source = this.sound.source;
          if (source) {
            source.onended = () => {
              clearTimeout(fallbackTimer);
              safeCallback();
            };
          } else {
            clearTimeout(fallbackTimer);
            safeCallback();
          }
        }, (err) => {
          console.error("Gagal decode data Audio Worker:", err);
          clearTimeout(fallbackTimer);
          safeCallback();
        });
      }
    });

    // Komponen Flight Naga
    AFRAME.registerComponent('random-flight', {
      init: function () {
        this.state = 'idle';
        this.homePos = '0 0.2 0';
        this.startIdle();

        this.flightTimer = setInterval(() => {
          const dragon = document.getElementById('dragon-entity');
          const isVisible = dragon ? dragon.getAttribute('visible') : false;
          if ((isVisible === true || isVisible === 'true') && this.state === 'idle') {
            this.flyRandomly();
          }
        }, 8000);

        this.el.addEventListener('animationcomplete__fly', (e) => {
          if (this.state === 'flying') {
            setTimeout(() => this.returnHome(), 1000);
          } else if (this.state === 'returning') {
            this.startIdle();
          }
        });
      },

      startIdle: function() {
        this.state = 'idle';
        this.el.removeAttribute('animation__fly');
        this.el.setAttribute('animation__fly', { property: 'position', from: '0 0.2 0', to: '0 0.28 0', dir: 'alternate', dur: 1500, loop: true, easing: 'easeInOutSine' });
      },

      flyRandomly: function() {
        this.state = 'flying';
        this.el.removeAttribute('animation__fly');
        const x = (Math.random() - 0.5) * 1.6;
        const y = 0.2 + (Math.random() * 0.6);
        const z = (Math.random() - 0.5) * 1.6;

        this.el.setAttribute('animation__fly', { property: 'position', to: `${x} ${y} ${z}`, dur: 3000, loop: false, easing: 'easeInOutQuad' });
      },

      returnHome: function() {
        this.state = 'returning';
        this.el.removeAttribute('animation__fly');
        this.el.setAttribute('animation__fly', { property: 'position', to: this.homePos, dur: 2500, loop: false, easing: 'easeInOutQuad' });
      }
    });

    // Fire Dust Trail
    AFRAME.registerComponent('fire-dust', {
      init: function () {
        const colors = ['#ff4400', '#ff9900', '#ffdd00', '#ffffff', '#ffeeaa'];
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
          const p = document.createElement('a-sphere');
          const radius = Math.random() * 0.05;
          const angle = Math.random() * Math.PI * 2;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;
          const y = (Math.random() - 0.5) * 0.1;

          const isGlow = Math.random() > 0.6;
          const size = isGlow ? (0.002 + Math.random() * 0.002) : (0.0008 + Math.random() * 0.001);
          const color = colors[Math.floor(Math.random() * colors.length)];
          const maxOpacity = isGlow ? 0.4 : 0.9;

          const dur = 4000 + Math.random() * 5000;
          const delay = Math.random() * 6000;

          p.setAttribute('radius', size);
          p.setAttribute('position', `${x} ${y} ${z}`);
          p.setAttribute('material', `shader: flat; color: ${color}; transparent: true; opacity: 0; blending: additive`);

          p.setAttribute(`animation__float`, {
            property: 'position',
            to: `${x + (Math.random()-0.5)*0.3} ${y + 0.15 + Math.random()*0.2} ${z + (Math.random()-0.5)*0.3}`,
            dur: dur, delay: delay, loop: true, dir: 'normal', easing: 'linear'
          });

          p.setAttribute(`animation__fade`, {
            property: 'material.opacity',
            from: 0, to: maxOpacity, dur: dur / 2, delay: delay, loop: true, dir: 'alternate', easing: 'easeInOutSine'
          });

          this.el.appendChild(p);
        }
      }
    });

    /* ========= BALON KOMIK: satu plane bertekstur canvas, lengkap dengan buntut ========= */
    AFRAME.registerComponent('comic-bubble', {
      schema: {
        pxPerMeter: { type: 'number', default: 950 },
        fill:    { default: '#FFF6E5' },
        ink:     { default: '#2A1150' },
        outline: { default: '#2A1150' }
      },

      init: function () {
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.mesh = null;
        this._pending = null;

        // gambar ulang saat webfont selesai dimuat supaya huruf tidak jatuh ke fallback
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => { if (this._pending) this.render(this._pending); });
        }
      },

      wrap: function (ctx, str, maxW) {
        const out = [];
        str.split('\n').forEach(para => {
          if (!para.trim()) { out.push(''); return; }
          let cur = '';
          para.trim().split(/\s+/).forEach(word => {
            // kata super panjang dipotong per huruf
            while (ctx.measureText(word).width > maxW) {
              let cut = word.length;
              while (cut > 1 && ctx.measureText(word.slice(0, cut)).width > maxW) cut--;
              if (cur) { out.push(cur); cur = ''; }
              out.push(word.slice(0, cut));
              word = word.slice(cut);
            }
            const test = cur ? cur + ' ' + word : word;
            if (!cur || ctx.measureText(test).width <= maxW) cur = test;
            else { out.push(cur); cur = word; }
          });
          if (cur) out.push(cur);
        });
        return out.length ? out : ['...'];
      },

      render: function (text) {
        const str = (text || '').toString().trim() || '...';
        this._pending = str;

        const DPR = 2;
        const F = 34, LH = 46, PADX = 38, PADY = 30, R = 36, OUT = 9;
        const TAILH = 44, TAILW = 50, MAXW = 470;

        const ctx = this.ctx;
        const font = "700 " + F + "px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif";
        ctx.font = font;

        const lines = this.wrap(ctx, str, MAXW);
        let textW = 0;
        lines.forEach(l => { textW = Math.max(textW, ctx.measureText(l).width); });
        textW = Math.min(Math.max(textW, 110), MAXW);

        const bw = Math.round(textW + PADX * 2);
        const bh = Math.round(lines.length * LH + PADY * 2);
        const cw = bw + OUT * 2;
        const ch = bh + OUT * 2 + TAILH;

        this.canvas.width = cw * DPR;
        this.canvas.height = ch * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, cw, ch);
        ctx.font = font;

        // --- jalur balon: kotak membulat + buntut segitiga di bawah ---
        const x = OUT, y = OUT, w = bw, h = bh, cx = x + w / 2;
        ctx.beginPath();
        ctx.moveTo(x + R, y);
        ctx.lineTo(x + w - R, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + R);
        ctx.lineTo(x + w, y + h - R);
        ctx.quadraticCurveTo(x + w, y + h, x + w - R, y + h);
        ctx.lineTo(cx + TAILW / 2, y + h);
        ctx.lineTo(cx - TAILW * 0.12, y + h + TAILH);
        ctx.lineTo(cx - TAILW / 2, y + h);
        ctx.lineTo(x + R, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - R);
        ctx.lineTo(x, y + R);
        ctx.quadraticCurveTo(x, y, x + R, y);
        ctx.closePath();

        ctx.lineJoin = 'round';
        ctx.strokeStyle = this.data.outline;
        ctx.lineWidth = OUT * 2;
        ctx.stroke();
        ctx.fillStyle = this.data.fill;
        ctx.fill();

        // kilau kecil ala kartun
        ctx.save();
        ctx.clip();
        const g = ctx.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, 'rgba(255,255,255,.9)');
        g.addColorStop(.45, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);
        ctx.restore();

        // --- teks ---
        ctx.fillStyle = this.data.ink;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        lines.forEach((l, i) => ctx.fillText(l, cx, y + PADY + LH / 2 + i * LH));

        // --- mesh ---
        const wM = cw / this.data.pxPerMeter;
        const hM = ch / this.data.pxPerMeter;

        const tex = new THREE.CanvasTexture(this.canvas);
        tex.needsUpdate = true;
        tex.anisotropy = 8;
        if (THREE.sRGBEncoding !== undefined) tex.encoding = THREE.sRGBEncoding;

        if (this.mesh) {
          if (this.mesh.material.map) this.mesh.material.map.dispose();
          this.mesh.material.map = tex;
          this.mesh.material.needsUpdate = true;
          this.mesh.geometry.dispose();
          this.mesh.geometry = new THREE.PlaneGeometry(wM, hM);
        } else {
          const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
          this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(wM, hM), mat);
          this.mesh.renderOrder = 10;
          this.el.setObject3D('bubble', this.mesh);
        }
        // titik jangkar entity = ujung buntut, jadi balon selalu duduk di atas kepala naga
        this.mesh.position.set(0, hM / 2, 0);
      },

      remove: function () {
        if (this.mesh) {
          this.el.removeObject3D('bubble');
          this.mesh.geometry.dispose();
          if (this.mesh.material.map) this.mesh.material.map.dispose();
          this.mesh.material.dispose();
          this.mesh = null;
        }
      }
    });

    /* ========= KAMERA GYRO SADAR-ORIENTASI-LAYAR =========
       look-controls bawaan A-Frame mengabaikan sudut layar, jadi tampilan miring
       saat HP/tablet dipakai landscape. Komponen ini menghitung sendiri kuaternion
       kamera dari deviceorientation + screen.orientation.angle. ================= */
    AFRAME.registerComponent('magic-window', {
      init: function () {
        this.active = false;
        this.orient = 0;
        this.deviceOrientation = null;

        this.euler = new THREE.Euler();
        this.q0 = new THREE.Quaternion();
        this.q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90deg sumbu X
        this.zee = new THREE.Vector3(0, 0, 1);

        this.onOrientationChange = () => {
          let angle = 0;
          if (screen.orientation && typeof screen.orientation.angle === 'number') angle = screen.orientation.angle;
          else if (typeof window.orientation === 'number') angle = window.orientation;
          this.orient = THREE.MathUtils.degToRad(angle);
        };

        this.onDeviceOrientation = (e) => {
          if (e.alpha === null && e.beta === null && e.gamma === null) return;
          this.deviceOrientation = e;
          if (!this.active && window.AR && AR.active && AR.mode !== 'webxr') {
            this.active = true;
            // matikan look-controls supaya tidak rebutan menulis rotasi kamera
            this.el.setAttribute('look-controls', 'enabled', false);
          }
        };

        this.onOrientationChange();
        window.addEventListener('deviceorientation', this.onDeviceOrientation);
        window.addEventListener('orientationchange', this.onOrientationChange);
        if (screen.orientation && screen.orientation.addEventListener) {
          screen.orientation.addEventListener('change', this.onOrientationChange);
        }
      },

      tick: function () {
        if (!this.active || !this.deviceOrientation) return;
        if (!window.AR || !AR.active || AR.mode === 'webxr') return;

        const d = this.deviceOrientation;
        const alpha = THREE.MathUtils.degToRad(d.alpha || 0);
        const beta  = THREE.MathUtils.degToRad(d.beta  || 0);
        const gamma = THREE.MathUtils.degToRad(d.gamma || 0);

        this.euler.set(beta, alpha, -gamma, 'YXZ');
        const q = this.el.object3D.quaternion;
        q.setFromEuler(this.euler);
        q.multiply(this.q1);                                       // layar tegak -> pandangan ke depan
        q.multiply(this.q0.setFromAxisAngle(this.zee, -this.orient)); // koreksi rotasi layar
      },

      remove: function () {
        window.removeEventListener('deviceorientation', this.onDeviceOrientation);
        window.removeEventListener('orientationchange', this.onOrientationChange);
        if (screen.orientation && screen.orientation.removeEventListener) {
          screen.orientation.removeEventListener('change', this.onOrientationChange);
        }
      }
    });

    /* ========= HIT-TEST GYRO (fallback non-WebXR, jalan di semua device) ========= */
    AFRAME.registerComponent('gyro-hit-test', {
      init: function () {
        this._dir = new THREE.Vector3();
        this._pos = new THREE.Vector3();
        this._q = new THREE.Quaternion();
        this._hit = new THREE.Vector3();
      },
      tick: function () {
        if (!window.AR || !AR.active || AR.mode === 'webxr') return;

        const reticle = document.getElementById('reticle');
        const dragon = document.getElementById('dragon-entity');
        if (!reticle || !dragon) return;

        const placed = dragon.getAttribute('visible');
        if (placed === true || placed === 'true') { reticle.setAttribute('visible', 'false'); return; }

        const cam = this.el.sceneEl.camera;
        if (!cam) return;

        cam.getWorldPosition(this._pos);
        cam.getWorldQuaternion(this._q);
        this._dir.set(0, 0, -1).applyQuaternion(this._q);

        // Kamera harus menunduk supaya ketemu "lantai virtual"
        if (this._dir.y > -0.08) {
          reticle.setAttribute('visible', 'false');
          this.setHint(true, i18n[lang].arHintPoint);
          return;
        }

        let t = (AR.floorY - this._pos.y) / this._dir.y;
        t = Math.min(Math.max(t, 0.6), 1.8);

        this._hit.copy(this._pos).addScaledVector(this._dir, t);
        this._hit.y = AR.floorY;

        reticle.setAttribute('position', { x: this._hit.x, y: this._hit.y, z: this._hit.z });
        reticle.setAttribute('visible', 'true');

        this.setHint(false, i18n[lang].arHintFound);
      },
      setHint: function (hidePlace, text) {
        if (this._lastHide !== hidePlace) { this._lastHide = hidePlace; $('#btnPlace').hidden = hidePlace; }
        if (this._lastText !== text) { this._lastText = text; $('#arHint').textContent = text; }
      }
    });
  </script>

  <style>
    /* ============================================================
       MESSENG-AR — "Pos Langit" design system
       display: Baloo 2  |  body: Nunito
       ============================================================ */
    :root {
      --void:      #0C0620;
      --deep:      #140A2E;
      --panel:     #1D1140;
      --violet:    #7A5CFF;
      --bubblegum: #FF7AC6;
      --mint:      #5BE9C9;
      --sun:       #FFD166;
      --cream:     #F6F1FF;
      --lilac:     #B6A9E6;

      --r-lg: 30px;
      --r-md: 22px;
      --r-sm: 16px;

      --lift: 0 18px 40px -18px rgba(10, 2, 30, .9);
      --glow-violet: 0 10px 30px -10px rgba(122, 92, 255, .75);
      --rim: inset 0 1px 0 rgba(255,255,255,.16);

      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background-color: var(--void);
      color: var(--cream);
      height: 100vh; height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Latar spasial: nebula + bintang parallax ---------- */
    #space { position: fixed; inset: 0; z-index: 0; overflow: hidden; background:
      radial-gradient(120% 90% at 50% 0%, #241354 0%, var(--deep) 45%, var(--void) 100%); }
    #space .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; will-change: transform; }
    #space .orb.a { width: 62vw; height: 62vw; background: var(--violet); top: -14vw; left: -18vw; animation: drift 22s ease-in-out infinite; }
    #space .orb.b { width: 54vw; height: 54vw; background: var(--bubblegum); top: 34vh; right: -22vw; opacity: .38; animation: drift 27s ease-in-out infinite reverse; }
    #space .orb.c { width: 46vw; height: 46vw; background: var(--mint); bottom: -16vw; left: 8vw; opacity: .28; animation: drift 31s ease-in-out infinite; }
    #space .stars {
      position: absolute; inset: -8%;
      background-image:
        radial-gradient(1.6px 1.6px at 12% 18%, #fff 50%, transparent 51%),
        radial-gradient(1.4px 1.4px at 68% 12%, #fff 50%, transparent 51%),
        radial-gradient(1.8px 1.8px at 32% 62%, var(--sun) 50%, transparent 51%),
        radial-gradient(1.3px 1.3px at 84% 48%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 52% 86%, var(--mint) 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 8% 76%, #fff 50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 92% 82%, var(--bubblegum) 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 44% 34%, #fff 50%, transparent 51%);
      opacity: .8; animation: twinkle 5s ease-in-out infinite; will-change: transform;
    }
    @keyframes drift { 50% { transform: translate3d(6%, 5%, 0) scale(1.08); } }
    @keyframes twinkle { 50% { opacity: .45; } }

    .screen {
      position: absolute; inset: 0; margin: 0 auto;
      max-width: 520px; width: 100%;
      display: flex; flex-direction: column;
      z-index: 20; background: transparent;
    }

    /* ---------- Kartu kaca ---------- */
    .glass-panel {
      position: relative;
      background: linear-gradient(160deg, rgba(58,36,110,.92), rgba(20,10,46,.92));
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(182,169,230,.22);
      border-radius: var(--r-lg);
      padding: 28px 24px 24px;
      text-align: center;
      box-shadow: var(--lift), var(--rim);
      width: 92%; max-width: 400px;
      animation: pop-in .45s cubic-bezier(.2,1.3,.4,1) both;
    }
    .glass-panel::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(90% 60% at 50% -10%, rgba(255,255,255,.14), transparent 60%);
    }
    @keyframes pop-in { from { opacity: 0; transform: translateY(18px) scale(.94); } }

    /* Kapsul kurir di atas kartu (signature) */
    .capsule {
      width: 76px; height: 76px; margin: -60px auto 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff 0%, var(--sun) 22%, var(--bubblegum) 58%, var(--violet) 100%);
      box-shadow: 0 0 0 8px rgba(122,92,255,.18), 0 14px 30px -10px rgba(255,122,198,.7);
      animation: bob 3.4s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(-7px) rotate(-4deg); } }

    /* ---------- Header ---------- */
    header {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
      padding: calc(12px + var(--safe-t)) 16px 12px;
      position: relative; z-index: 10;
    }
    .header-inner {
      grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
      background: linear-gradient(150deg, rgba(58,36,110,.75), rgba(20,10,46,.7));
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(182,169,230,.2);
      border-radius: 26px; padding: 8px 10px;
      box-shadow: var(--lift), var(--rim);
    }
    .logo {
      font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; font-size: 25px; font-weight: 800; letter-spacing: .5px;
      margin: 0; text-align: center; line-height: 1.1;
      background: linear-gradient(96deg, var(--mint), var(--sun) 45%, var(--bubblegum));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255,122,198,.35));
    }
    .logo small { display: block; font-family: 'Nunito'; font-size: 9.5px; font-weight: 700; letter-spacing: 2.4px;
      -webkit-text-fill-color: var(--lilac); opacity: .8; margin-top: -2px; }

    /* ---------- Tombol ---------- */
    .primary-btn {
      font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--violet), var(--bubblegum));
      color: #fff; border: none; border-radius: 20px;
      padding: 13px 22px; font-weight: 700; font-size: 16.5px; letter-spacing: .3px;
      cursor: pointer; pointer-events: auto; flex-shrink: 0; white-space: nowrap;
      box-shadow: var(--glow-violet), var(--rim);
      transition: transform .16s cubic-bezier(.2,1.4,.4,1), box-shadow .16s ease, opacity .2s;
    }
    .primary-btn:active { transform: scale(.93) translateY(2px); box-shadow: 0 4px 14px -6px rgba(122,92,255,.8); }
    .primary-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .primary-btn.ghost { background: rgba(182,169,230,.12); border: 1.5px solid rgba(182,169,230,.28); box-shadow: none; color: var(--lilac); }

    .iconbtn {
      width: 44px; height: 44px; border-radius: 16px;
      border: 1.5px solid rgba(182,169,230,.24);
      background: rgba(122,92,255,.16); color: var(--mint);
      font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; flex: none; pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      transition: transform .16s cubic-bezier(.2,1.4,.4,1), background .2s;
      box-shadow: 0 6px 16px -8px rgba(0,0,0,.9), var(--rim);
    }
    .iconbtn:active { transform: scale(.9); background: rgba(122,92,255,.34); }
    .iconbtn.sm { width: 38px; height: 38px; border-radius: 13px; }

    /* ---------- Daftar pesan ---------- */
    #msgs { flex: 1; overflow-y: auto; padding: 6px 16px 10px; display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; }
    #msgs::-webkit-scrollbar { width: 0; }
    #msgs > :first-child { margin-top: auto; }

    .msg-wrap { display: flex; align-items: flex-end; gap: 8px; width: 100%; margin-bottom: 10px; position: relative;
      animation: rise .35s cubic-bezier(.2,1.2,.4,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.96); } }
    .msg-wrap.out { justify-content: flex-end; }
    .msg-wrap.in { justify-content: flex-start; }
    .msg-wrap.evt { justify-content: center; align-items: center; margin: 14px 0; position: relative; }

    .bub {
      position: relative; max-width: 76%;
      padding: 13px 17px; border-radius: 22px;
      font-size: 15px; line-height: 1.5; word-wrap: break-word;
      box-shadow: var(--lift), var(--rim);
    }
    .bub b { font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .2px; opacity: .95; }
    .bub small { display: block; opacity: .6; font-size: 11px; margin-top: 6px; font-weight: 600; }
    .bub audio { max-width: 100%; display: block; margin-top: 10px; height: 36px; outline: none; border-radius: 18px; }

    .out-bub {
      background: linear-gradient(140deg, var(--violet), #B15CFF 55%, var(--bubblegum));
      border-bottom-right-radius: 7px; color: #fff;
    }
    .out-bub b { color: rgba(255,255,255,.9); }
    .out-bub::after { content: ""; position: absolute; right: -5px; bottom: 1px; width: 0; height: 0;
      border-left: 9px solid var(--bubblegum); border-top: 8px solid transparent; }

    .in-bub {
      background: linear-gradient(140deg, rgba(66,44,124,.9), rgba(28,16,60,.92));
      border: 1.5px solid rgba(91,233,201,.28);
      border-bottom-left-radius: 7px;
    }
    .in-bub b { color: var(--mint); }

    /* Kapsul kurir (event) */
    .bub-event {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(120deg, rgba(122,92,255,.28), rgba(91,233,201,.18));
      border: 1.5px dashed rgba(91,233,201,.55);
      border-radius: 999px; padding: 11px 20px;
      font-size: 12.5px; font-weight: 700; letter-spacing: .2px;
      cursor: pointer; color: var(--cream);
      box-shadow: 0 0 22px -6px rgba(91,233,201,.5), var(--rim);
      transition: transform .16s cubic-bezier(.2,1.4,.4,1), box-shadow .2s;
      animation: hover-float 3.2s ease-in-out infinite;
    }
    .bub-event::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
      background: var(--mint); box-shadow: 0 0 10px var(--mint); }
    .bub-event:active { transform: scale(.94); box-shadow: 0 0 30px -4px rgba(91,233,201,.8); }
    @keyframes hover-float { 50% { transform: translateY(-4px); } }

    .del-btn {
      background: rgba(182,169,230,.1); border: 1.5px solid rgba(255,122,198,.28);
      color: var(--bubblegum); font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; font-size: 12px; font-weight: 700;
      cursor: pointer; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      transition: all .18s ease; width: 28px; height: 28px; flex-shrink: 0;
      opacity: .45; margin-bottom: 6px;
    }
    .del-btn:hover, .del-btn:active { opacity: 1; background: rgba(255,122,198,.24); transform: scale(1.12) rotate(8deg); }
    .evt .del-btn { margin-bottom: 0; position: absolute; right: 0; }

    /* ---------- Composer (dock melayang) ---------- */
    .composer {
      display: flex; flex-direction: column; gap: 10px;
      margin: 0 12px calc(12px + var(--safe-b));
      padding: 12px;
      background: linear-gradient(150deg, rgba(58,36,110,.82), rgba(20,10,46,.86));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(182,169,230,.2);
      border-radius: 28px;
      box-shadow: var(--lift), var(--rim);
      z-index: 10; width: auto;
    }
    .composer-inputs { display: flex; gap: 9px; width: 100%; align-items: center; }

    .auto-delete-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 8px 2px;
      font-size: 12px; font-weight: 700; color: var(--lilac); }
    .toggle-switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: rgba(12,6,32,.9);
      transition: .3s cubic-bezier(.2,1.3,.4,1); border-radius: 999px; border: 1.5px solid rgba(182,169,230,.3); }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px;
      background: var(--lilac); transition: .3s cubic-bezier(.2,1.3,.4,1); border-radius: 50%; }
    input:checked + .slider { background: linear-gradient(120deg, var(--violet), var(--bubblegum)); border-color: transparent; }
    input:checked + .slider:before { transform: translateX(18px); background: #fff; }

    #txt {
      flex: 1; min-width: 0; font-family: 'Nunito', sans-serif;
      border: 1.5px solid rgba(182,169,230,.2); border-radius: 18px;
      padding: 14px 18px; background: rgba(12,6,32,.72); color: var(--cream);
      font-size: 15.5px; font-weight: 600; outline: none;
      transition: border-color .25s, box-shadow .25s;
    }
    #txt::placeholder { color: rgba(182,169,230,.6); }
    #txt:focus { border-color: rgba(91,233,201,.65); box-shadow: 0 0 0 4px rgba(91,233,201,.12); }

    #replyBanner {
      padding: 10px 8px 10px 16px;
      background: linear-gradient(100deg, rgba(91,233,201,.2), rgba(122,92,255,.2));
      font-size: 13px; font-weight: 700;
      display: flex; justify-content: space-between; align-items: center;
      border-radius: 18px; color: var(--cream);
      border: 1.5px solid rgba(91,233,201,.35);
    }
    #replyBanner::before { content: ""; width: 4px; height: 18px; border-radius: 4px; background: var(--mint);
      margin-right: 10px; flex-shrink: 0; box-shadow: 0 0 8px var(--mint); }

    .mic-on { background: linear-gradient(135deg, #FF5C8A, var(--bubblegum)) !important; color: #fff !important;
      border-color: rgba(255,255,255,.4) !important; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255,122,198,.14); } }

    /* ---------- Overlay ---------- */
    .overlay {
      justify-content: center; align-items: center; padding: 24px;
      background: radial-gradient(80% 60% at 50% 40%, rgba(36,19,84,.7), rgba(12,6,32,.9));
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      z-index: 30;
    }
    .overlay h2 { font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; margin: 0 0 8px; font-size: 25px; font-weight: 800; color: #fff; }
    .overlay p { margin: 0 0 20px; color: var(--lilac); font-size: 14.5px; line-height: 1.55; font-weight: 600; }

    #shareLink {
      background: rgba(12,6,32,.8); border: 1.5px dashed rgba(91,233,201,.4);
      border-radius: 18px; padding: 14px; font-size: 12.5px; font-weight: 700;
      color: var(--mint); word-break: break-all; margin-bottom: 20px;
      max-height: 110px; overflow-y: auto;
    }
    .row { display: flex; gap: 10px; justify-content: center; align-items: center; }
    .row .primary-btn { flex: 1; }

    #nameInput {
      width: 100%; font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; padding: 15px; border-radius: 18px;
      border: 1.5px solid rgba(91,233,201,.4); background: rgba(12,6,32,.8); color: #fff;
      margin-bottom: 18px; font-size: 18px; font-weight: 700; text-align: center; outline: none;
      transition: border-color .25s, box-shadow .25s;
    }
    #nameInput:focus { border-color: var(--mint); box-shadow: 0 0 0 4px rgba(91,233,201,.14); }

    /* ---------- UI di dalam AR ---------- */
    #camFeed { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 90; background: #000; }
    #ar-ui-container {
      position: absolute; inset: 0; margin: 0 auto; max-width: 520px; width: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
      padding: calc(16px + var(--safe-t)) 18px calc(16px + var(--safe-b));
      z-index: 105;
    }
    .ar-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; pointer-events: auto; }
    .ar-top .logo { font-size: 21px; }
    #arMode {
      justify-self: end; font-size: 10.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      padding: 7px 12px; border-radius: 999px; color: var(--mint);
      background: rgba(12,6,32,.6); border: 1.5px solid rgba(91,233,201,.35);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #arHint {
      align-self: center; text-align: center; color: #fff; font-weight: 700; font-size: 15px;
      background: rgba(12,6,32,.62); padding: 12px 22px; border-radius: 999px;
      border: 1.5px solid rgba(182,169,230,.28); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      pointer-events: none; max-width: 320px; line-height: 1.4;
      box-shadow: var(--lift); animation: hover-float 3.6s ease-in-out infinite;
    }
    #arBtns { display: flex; justify-content: center; gap: 12px; pointer-events: auto; margin-bottom: 12px; flex-wrap: wrap; }

    #toast {
      position: fixed; bottom: calc(112px + var(--safe-b)); left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(58,36,110,.96), rgba(20,10,46,.96));
      border: 1.5px solid rgba(91,233,201,.4); border-radius: 999px;
      padding: 13px 24px; font-size: 13.5px; font-weight: 700;
      z-index: 200; color: var(--cream); box-shadow: var(--lift), var(--rim);
      max-width: 88vw; text-align: center;
      animation: toast-in .34s cubic-bezier(.2,1.4,.4,1) both;
    }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px) scale(.9); } }

    .empty { margin: auto; text-align: center; padding: 24px; animation: pop-in .5s cubic-bezier(.2,1.3,.4,1) both; }
    .empty .egg { display: block; width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff 0%, var(--sun) 20%, var(--bubblegum) 55%, var(--violet) 100%);
      box-shadow: 0 0 0 8px rgba(122,92,255,.14), 0 14px 30px -10px rgba(255,122,198,.6);
      animation: bob 3.4s ease-in-out infinite; }
    .empty h3 { font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; font-size: 21px; font-weight: 700; margin: 0 0 6px; color: var(--cream); }
    .empty p { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--lilac); line-height: 1.6; max-width: 260px; }

    :focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

<div id="space" aria-hidden="true">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="stars"></div>
</div>

<div id="screen-chat" class="screen">
  <header>
    <div class="header-inner">
      <button id="btnClear" class="iconbtn sm" title="Bersihkan Obrolan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
      </button>
      <h1 class="logo">MESSENG-AR<small>KURIR NAGA</small></h1>
      <div style="display: flex; gap: 7px; justify-content: flex-end;">
        <button id="btnLang" class="iconbtn sm" title="Ganti Bahasa">ID</button>
        <button id="btnName" class="iconbtn sm" title="Ganti Nama">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="msgs"></div>

  <div class="composer">
    <div id="replyBanner" hidden>
      <span id="replyLabel"></span>
      <button class="iconbtn sm" style="width:30px;height:30px;border-radius:11px;font-size:12px;" id="btnCancelReply" title="Batal balas">X</button>
    </div>

    <div class="composer-inputs">
      <button id="btnMic" class="iconbtn" title="Rekam Suara">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>

      <input id="txt" placeholder="Ketik pesan..." autocomplete="off">

      <button id="btnSend" class="primary-btn" style="width: 52px; height: 52px; padding: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center;" title="Kirim">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>

    <div class="auto-delete-bar">
      <span id="lblAutoDelete">Hapus otomatis setelah dibaca</span>
      <label class="toggle-switch">
        <input type="checkbox" id="chkAutoDelete">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<div id="screen-share" class="screen overlay" hidden>
  <div class="glass-panel">
    <div class="capsule"></div>
    <h2 id="shareTitleUI">Pesan Siap Terbang!</h2>
    <p id="shareDescUI">Bagikan link ini ke penerima. Saat dibuka, kurir akan muncul di AR mengantar pesanmu.</p>
    <div id="shareLink"></div>
    <div class="row">
      <button id="btnShare" class="primary-btn" disabled>Bagikan</button>
      <button id="btnCopy" class="primary-btn ghost" disabled>Salin</button>
      <button id="btnShareBack" class="iconbtn" title="Tutup">X</button>
    </div>
  </div>
</div>

<div id="screen-incoming" class="screen overlay" hidden>
  <div class="glass-panel">
    <div class="capsule"></div>
    <h2 id="incTitleUI">Kurir Tiba!</h2>
    <p id="incFrom"></p>
    <button id="btnAccept" class="primary-btn" style="display: none; width: 100%;">Buka di AR</button>
    <button id="btnIncLater" class="primary-btn ghost" style="margin-top: 10px; width: 100%;">Tutup</button>
  </div>
</div>

<div id="nameModal" class="screen overlay" hidden>
  <div class="glass-panel">
    <div class="capsule"></div>
    <h2 id="nameTitleUI">Selamat Datang</h2>
    <p id="nameDescUI">Masukkan nama kamu sebagai pengirim:</p>
    <input id="nameInput" maxlength="16" placeholder="Nama...">
    <button id="btnNameSave" class="primary-btn" style="width: 100%;">Mulai</button>
  </div>
</div>

<div id="toast" hidden></div>
<audio id="spawnSound" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3?filename=magic-spell-8780.mp3" preload="auto" hidden></audio>

<video id="camFeed" playsinline muted autoplay hidden></video>

<div id="ar-ui-container" hidden>
  <div class="ar-top">
    <div><button id="btnBackAR" class="iconbtn" title="Keluar AR">&lt;</button></div>
    <h1 class="logo">MESSENG-AR</h1>
    <div id="arMode">AR</div>
  </div>
  <div id="arHint">Pindai lantai hingga cincin muncul.</div>
  <div id="arBtns">
    <button id="btnPlace" class="primary-btn" hidden>Tampilkan Pesan</button>
    <button id="btnReply" class="primary-btn" hidden>Balas Pesan</button>
    <button id="btnBack" class="primary-btn ghost" hidden>Kembali</button>
  </div>
</div>

<div id="scene-wrapper" style="position: absolute; inset: 0; z-index: -100; visibility: hidden;">
  <a-scene webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #ar-ui-container;" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" background="transparent: true">
    <a-camera id="camera" position="0 1.6 0" wasd-controls-enabled="false" magic-window></a-camera>
    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
    <a-light type="ambient" intensity="0.6"></a-light>
    <a-entity id="xr-manager" webxr-hit-test gyro-hit-test></a-entity>

    <a-sky id="diorama-sky" color="#140A2E" visible="false"></a-sky>

    <a-entity id="reticle" visible="false">
      <a-ring color="#5BE9C9" radius-inner="0.1" radius-outer="0.13" theta-length="260" rotation="-90 0 0" material="shader: flat; transparent: true; opacity: 0.95; side: double"
        animation__spin="property: rotation; to: -90 360 0; dur: 6000; loop: true; easing: linear"></a-ring>
      <a-ring color="#FF7AC6" radius-inner="0.16" radius-outer="0.175" rotation="-90 0 0" material="shader: flat; transparent: true; opacity: 0.55"
        animation__pulse="property: scale; from: 1 1 1; to: 1.18 1.18 1.18; dir: alternate; dur: 1200; loop: true; easing: easeInOutSine"></a-ring>
      <a-circle color="#FFD166" radius="0.02" rotation="-90 0 0" position="0 0.005 0" material="shader: flat; transparent: true; opacity: 0.9"></a-circle>
    </a-entity>

    <a-entity id="dragon-entity" visible="false" position="0 0 0">
      <a-entity id="magic-burst" visible="false" position="0 0.12 0" scale="1.6 1.6 1.6">
        <a-ring id="magic-ring" color="#FF7AC6" radius-inner="0.05" radius-outer="0.1" rotation="-90 0 0" material="shader: flat; transparent: true; opacity: 1"></a-ring>
        <a-sphere id="magic-sphere" color="#ffffff" radius="0.05" material="shader: flat; transparent: true; opacity: 1"></a-sphere>
      </a-entity>

      <a-entity id="dragon-mover" random-flight spatial-tts="refDistance: 1; maxDistance: 10; rolloffFactor: 1">
        <a-entity id="dragon-model" gltf-model="https://wolfpuplabs.github.io/MessengAR/dragon.glb" scale="0.008 0.008 0.008" position="0 0 0" animation-mixer></a-entity>
        <a-entity id="dragon-fire-dust" fire-dust position="0 0.08 -0.2" scale="3 3 3"></a-entity>

        <a-entity id="dragon-bubble" look-at="[camera]" comic-bubble position="0 0.85 0" visible="false"></a-entity>
      </a-entity>

  let lang = store.get('sar_lang', 'id');

  function applyLang() {

  $('#btnLang').onclick = () => { lang = lang === 'id' ? 'en' : 'id'; store.set('sar_lang', lang); applyLang(); };

  /* ================= STATE ================= */
  let myName = store.get('sar_name', '');
  let msgs = JSON.parse(store.get('sar_msgs', '[]'));
  let autoDelete = store.get('sar_autodel', 'false') === 'true';
  let currentPayload = null; let pendingAudioBlob = null; let lastShare = ''; let replyTo = null; let replyAllowed = false;

  $('#chkAutoDelete').checked = autoDelete;
  $('#chkAutoDelete').onchange = (e) => { autoDelete = e.target.checked; store.set('sar_autodel', autoDelete); };

  function saveName() {
    const v = ($('#nameInput').value || '').trim() || 'Anon';

  $('#btnClear').onclick = () => {
    if (confirm(i18n[lang].confirmClear)) { msgs = []; store.set('sar_msgs', '[]'); renderMsgs(); toast(i18n[lang].toastClear); }

  /* ================= RENDER MESSAGES ================= */
  function renderMsgs() {
    const t = i18n[lang]; const box = $('#msgs'); box.innerHTML = '';

    if (!msgs.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<span class="egg"></span><h3>' + (lang === 'id' ? 'Belum ada kiriman' : 'No deliveries yet') + '</h3>' +
                    '<p>' + (lang === 'id'
                      ? 'Tulis pesan, kirim linknya, lalu naga kurir akan mengantarnya di dunia nyata.'
                      : 'Write a message, send the link, and the dragon courier delivers it in the real world.') + '</p>';
      box.appendChild(e);
      return;
    }

    msgs.forEach((m, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap ' + (m.kind === 'event' ? 'evt' : (m.dir === 'out' ? 'out' : 'in'));

      const d = document.createElement('div');
      if (m.kind === 'event') {
        d.className = 'bub-event'; d.dataset.i = i;
        const pObj = Array.isArray(m.payload) ? { from: m.payload[2], to: m.payload[3] } : m.payload;
        const actionTxt = m.dir === 'out' ? t.msgSent + (pObj.to ? (lang === 'id' ? ' ke ' : ' to ') + pObj.to : '') : t.msgArr + pObj.from;
        d.textContent = actionTxt + ' — Tap';
      } else {
        d.className = 'bub ' + (m.dir === 'out' ? 'out-bub' : 'in-bub');
        let html = '<b>' + (m.dir === 'out' ? myName : m.from) + '</b><br>' + m.text;
        if (m.payload && m.payload.audio) html += '<audio controls src="' + m.payload.audio + '"></audio>';
        html += '<small>' + new Date(m.t).toLocaleTimeString() + '</small>';

      const delBtn = document.createElement('button'); delBtn.className = 'del-btn'; delBtn.innerHTML = 'X'; delBtn.title = "Delete";
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if(confirm(t.confirmDelMsg)) {
          const msgId = Array.isArray(m.payload) ? m.payload[1] : (m.payload ? m.payload.id : null);
          if (msgId) { db.ref('messages/' + msgId).remove(); }
          msgs.splice(i, 1); store.set('sar_msgs', JSON.stringify(msgs)); renderMsgs();
        }
      };

      if (m.kind === 'event') { wrap.appendChild(d); wrap.appendChild(delBtn); }
      else if (m.dir === 'out') { wrap.appendChild(delBtn); wrap.appendChild(d); }
      else { wrap.appendChild(d); wrap.appendChild(delBtn); }
      box.appendChild(wrap);

    box.scrollTop = box.scrollHeight;

  function deleteMsgByPayloadId(payloadId) {
    if (!payloadId) return;
    msgs = msgs.filter(m => { const pid = Array.isArray(m.payload) ? m.payload[1] : (m.payload ? m.payload.id : null); return pid !== payloadId; });
    store.set('sar_msgs', JSON.stringify(msgs)); renderMsgs();
  }

  $('#msgs').addEventListener('click', e => {
    const el = e.target.closest('.bub-event'); if (!el) return;
    const m = msgs[el.dataset.i];
    if (m && m.payload) {
      const p = Array.isArray(m.payload) ? { v: m.payload[0], id: m.payload[1], from: m.payload[2], to: m.payload[3], text: m.payload[4], audio: m.payload[5], t: m.payload[6] } : m.payload;
      openAR(p);

  function setReply(name) {
    replyTo = name; $('#replyBanner').hidden = !name;
    if (name) { $('#replyLabel').textContent = i18n[lang].replyLabel + name; $('#txt').placeholder = i18n[lang].replyLabel + name + '...'; }
    else { $('#txt').placeholder = i18n[lang].plcTxt; }
  }
  $('#btnCancelReply').onclick = () => setReply(null);

  /* ================= MIC / AUDIO ================= */
  let mRec = null;
  $('#btnMic').onclick = () => {
    const t = i18n[lang];
    if (mRec) { mRec.stop(); return; }
    if (!navigator.mediaDevices) { toast(t.toastMicErr); return; }

    navigator.mediaDevices.getUserMedia({ audio: true }).then(st => {
      mRec = new MediaRecorder(st);
      const ch = []; mRec.ondataavailable = e => ch.push(e.data);

      mRec.onstop = () => {
        st.getTracks().forEach(track => track.stop());
        pendingAudioBlob = new Blob(ch, { type: mRec.mimeType });
        toast(t.toastMicAtt);
        mRec = null; $('#btnMic').classList.remove('mic-on');
      };

      mRec.start(); $('#btnMic').classList.add('mic-on'); toast(t.toastMicRec);
      setTimeout(() => { if (mRec) mRec.stop() }, 10000);
    }).catch(() => toast(t.toastMicDeny));

  /* ================= SEND TO FIREBASE & CLOUDINARY ================= */
  $('#btnSend').onclick = async () => {
    const text = $('#txt').value.trim();
    if (!text && !pendingAudioBlob) return toast(i18n[lang].toastEmpty);

    const uniqueId = uid();

    $('#screen-share').hidden = false;
    $('#shareLink').textContent = "Menyiapkan pesan...";

    $('#btnCopy').disabled = true;

    let finalAudioUrl = null;

    try {
      if (pendingAudioBlob) {
        $('#shareLink').textContent = "Mengunggah suara ke server...";

        formData.append("file", pendingAudioBlob);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
        const data = await res.json();

        if (data.secure_url) {
            finalAudioUrl = data.secure_url.replace(/\.[^/.]+$/, ".mp3");

            throw new Error("Gagal mengunggah ke Cloudinary");

      $('#shareLink').textContent = "Menyimpan ke AR Cloud...";
      const payloadObj = {

        from: myName,
        to: replyTo || null,
        text: text || '(Voice Message)',

        t: Date.now()

      const compactPayload = [1, payloadObj.id, payloadObj.from, payloadObj.to, payloadObj.text, payloadObj.audio, payloadObj.t];

      await db.ref('messages/' + uniqueId).set(payloadObj);

      if (!autoDelete) {
        msgs.push({ kind: 'event', dir: 'out', payload: compactPayload, t: Date.now() });

  $('#btnShareBack').onclick = () => $('#screen-share').hidden = true;
  $('#btnCopy').onclick = () => { navigator.clipboard.writeText(lastShare).then(() => toast(i18n[lang].toastCopy)); };
  $('#btnShare').onclick = async () => {
    try { await navigator.share({ title: i18n[lang].shareTitle, text: i18n[lang].shareText, url: lastShare }); }

  /* ================= INCOMING DATA (FIREBASE GET) ================= */
  const urlParams = new URLSearchParams(window.location.search);

  if (msgId) {
    $('#screen-incoming').hidden = false;

  $('#btnAccept').onclick = () => {
    $('#screen-incoming').hidden = true;

      const pid = Array.isArray(m.payload) ? m.payload[1] : (m.payload ? m.payload.id : null); return pid === currentPayload.id;
    })) {
      const compactPayload = [1, currentPayload.id, currentPayload.from, currentPayload.to, currentPayload.text, currentPayload.audio, currentPayload.t];
      msgs.push({ kind: 'event', dir: 'in', payload: compactPayload, t: Date.now() });
      store.set('sar_msgs', JSON.stringify(msgs)); renderMsgs();
    }
    openAR(currentPayload);

  /* ================= MANAJEMEN SUARA SPASIAL 3D VIA WORKER ================= */
  function speakAndPlay(payload, onFinish) {

    if (payload.audio) {
      const audioPlayer = new Audio(payload.audio);
      audioPlayer.crossOrigin = "anonymous";

      let finished = false;
      const done = () => {
        if (!finished) {
          finished = true;
          onFinish();
        }
      };

      audioPlayer.onended = done;
      audioPlayer.onerror = (err) => {
        console.error("HTML5 Audio Error:", err);
        done();
      };

      audioPlayer.play().catch(e => {
        console.warn("Autoplay blocked/failed, unlocking buttons directly:", e);
        done();
      });
      return;
    }

    const spatialComp = $('#dragon-mover').components['spatial-tts'];

    if (window.isWorkerReady && window.globalTTSWorker && spatialComp) {
      toast("Meracik Suara Spasial AI 3D...");

      window.globalTTSWorker.postMessage({
        action: 'generate',
        text: payload.text,
        voice: (lang === 'en') ? "af_heart" : "af_bella"
      });

      const handleWorkerResponse = (e) => {
        if (e.data.status === 'done') {
          window.globalTTSWorker.removeEventListener('message', handleWorkerResponse);
          spatialComp.playWorkerAudio(e.data.pcmData, onFinish);
        } else if (e.data.status === 'error') {
          window.globalTTSWorker.removeEventListener('message', handleWorkerResponse);
          fallbackTTS(payload.text, onFinish);
        }
      };

      window.globalTTSWorker.addEventListener('message', handleWorkerResponse);
      return;
    }

    fallbackTTS(payload.text, onFinish);
  }

  function fallbackTTS(text, onFinish) {
    if ('speechSynthesis' in window && text && text !== '(Voice Message)') {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = (lang === 'id') ? 'id-ID' : 'en-US';
      u.onend = onFinish; u.onerror = onFinish;
      speechSynthesis.speak(u);
    } else {
      setTimeout(onFinish, 1000);
    }
  }

  /* =====================================================================
     AR ENGINE — 3 mode otomatis:
     1. webxr   : WebXR hit-test asli (Android Chrome / headset)
     2. camera  : kamera getUserMedia + gyro (iOS Safari, Android lain, dll)
     3. diorama : tanpa kamera (desktop / kamera ditolak)
     ===================================================================== */
  window.AR = { mode: null, stream: null, active: false, floorY: 0, hasGyro: false, starting: false };

  let hasWebXR = false;
  (async () => {
    try { hasWebXR = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); }
    catch (e) { hasWebXR = false; }
  })();

  function updateModeBadge() {
    const el = $('#arMode'); if (!el) return;
    const t = i18n[lang];
    el.textContent = AR.mode === 'webxr' ? t.modeXR : (AR.mode === 'camera' ? t.modeCam : (AR.mode === 'diorama' ? t.modeDio : 'AR'));
  }

  // Izin gyro iOS 13+ harus dipanggil langsung dari gesture user
  function requestGyroPermission() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        return DeviceOrientationEvent.requestPermission().catch(() => {});
      }
    } catch (e) {}
    return Promise.resolve();
  }

  window.addEventListener('deviceorientation', function onDO(e) {
    if (e && (e.alpha !== null || e.beta !== null)) { AR.hasGyro = true; window.removeEventListener('deviceorientation', onDO); }
  });

  async function startFallbackAR() {
    if (AR.starting) return; AR.starting = true;

    const scene = document.querySelector('a-scene');
    const video = $('#camFeed');
    let gotCam = false;

    try {
      AR.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = AR.stream;
      video.hidden = false;
      await video.play().catch(() => {});
      gotCam = true;
    } catch (e) {
      console.warn('Kamera tidak tersedia:', e);
    }

    AR.mode = gotCam ? 'camera' : 'diorama';
    if (!gotCam) toast(i18n[lang].toastCamDeny, 3000);

    // Kanvas 3D transparan supaya video kamera kelihatan di belakang objek
    const applyTransparency = () => {
      try {
        scene.renderer.setClearColor(0x000000, 0);
        scene.renderer.setClearAlpha(0);
        if (scene.canvas) scene.canvas.style.background = 'transparent';
      } catch (e) {}
    };
    if (scene.hasLoaded) applyTransparency(); else scene.addEventListener('loaded', applyTransparency);

    $('#diorama-sky').setAttribute('visible', AR.mode === 'diorama');

    // Kontrol kamera: gyro (magic window) di HP, drag di desktop
    // magicWindow bawaan dimatikan: rotasi gyro ditangani komponen magic-window
    // (yang sadar sudut layar). look-controls hanya untuk drag di desktop/tanpa gyro.
    $('#camera').setAttribute('look-controls', {
      enabled: true,
      magicWindowTrackingEnabled: false,
      touchEnabled: true,
      mouseEnabled: true,
      pointerLockEnabled: false,
      reverseMouseDrag: false
    });

    AR.active = true;
    AR.starting = false;
    updateModeBadge();
    $('#arHint').hidden = false;
    $('#arHint').textContent = AR.mode === 'diorama' ? i18n[lang].arHintDio : i18n[lang].arHintPoint;
  }

  function stopFallbackAR() {
    AR.active = false;
    if (AR.stream) { AR.stream.getTracks().forEach(tr => tr.stop()); AR.stream = null; }
    const v = $('#camFeed'); v.hidden = true; v.srcObject = null;
  }

  /* ================= TAP UNTUK MENEMPATKAN ================= */
  function handleARTap(e) {
    if (e && e.target && e.target.closest && e.target.closest('button, input, a, label, audio')) return;

    const scene = document.querySelector('a-scene');
    const inWebXR = scene && scene.is('ar-mode');
    if (!inWebXR && !AR.active) return;

    const reticle = document.getElementById('reticle');
    if (reticle && (reticle.getAttribute('visible') === true || reticle.getAttribute('visible') === 'true')) {
      $('#btnPlace').click();
    }
  }

  window.addEventListener('touchstart', handleARTap);
  window.addEventListener('click', (e) => { if (AR.active && AR.mode !== 'webxr') handleARTap(e); });

  AFRAME.registerComponent('webxr-hit-test', {
    init: function () {
      this.xrHitTestSource = null; this.viewerSpace = null; this.refSpace = null;
      this.el.sceneEl.renderer.xr.addEventListener('sessionstart', () => {
        let session = this.el.sceneEl.renderer.xr.getSession();
        session.addEventListener('select', handleARTap);
        session.requestReferenceSpace('viewer').then((space) => {
          this.viewerSpace = space;
          session.requestHitTestSource({ space: this.viewerSpace }).then((hitTestSource) => { this.xrHitTestSource = hitTestSource; });
        });
        session.requestReferenceSpace('local-floor').then((space) => { this.refSpace = space; }).catch(() => {
          session.requestReferenceSpace('local').then((space) => { this.refSpace = space; });
        });
      });
      this.el.sceneEl.renderer.xr.addEventListener('sessionend', () => { this.xrHitTestSource = null; });
    },
    tick: function () {
      if (this.el.sceneEl.is('ar-mode')) {
        if (!this.viewerSpace) return;
        const dragon = document.getElementById('dragon-entity');
        const isDragonVisible = dragon.getAttribute('visible');
        if (isDragonVisible === true || isDragonVisible === 'true') { document.getElementById('reticle').setAttribute('visible', 'false'); return; }

        let frame = this.el.sceneEl.frame; let xrViewerPose = frame.getViewerPose(this.refSpace);
        if (this.xrHitTestSource && xrViewerPose) {
          let hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
          if (hitTestResults.length > 0) {
            let pose = hitTestResults[0].getPose(this.refSpace); const reticle = document.getElementById('reticle');
            reticle.setAttribute('position', pose.transform.position); reticle.setAttribute('visible', 'true');
            if (dragon.getAttribute('visible') === false || dragon.getAttribute('visible') === 'false') {
                $('#btnPlace').hidden = false; $('#arHint').textContent = i18n[lang].arHintFound;
            }
          } else {
             document.getElementById('reticle').setAttribute('visible', 'false');
             if (dragon.getAttribute('visible') === false || dragon.getAttribute('visible') === 'false') {
                $('#btnPlace').hidden = true; $('#arHint').textContent = i18n[lang].arHintSearch;
             }
          }
        }
      }
    }
  });

  /* ================= AR LOGIC & BUBBLE ================= */
  /* Tinggi naga diukur otomatis dari model, jadi balon tidak pernah menimpa kepalanya.
     Diukur ulang tepat saat "Tampilkan Pesan" ditekan (bukan cuma sekali di awal),
     supaya tidak tergantung timing event 'model-loaded' yang gampang meleset. */
  let dragonTopY = 0.95; // nilai cadangan jika pengukuran gagal
  function measureDragonTop() {
    try {
      const dm = $('#dragon-model');
      const mv = $('#dragon-mover');
      if (!dm || !mv) return dragonTopY;
      const box = new THREE.Box3().setFromObject(dm.object3D);
      if (!isFinite(box.max.y) || !isFinite(box.min.y)) return dragonTopY;
      const moverY = mv.object3D.position.y || 0;
      const h = box.max.y - moverY;
      if (isFinite(h) && h > 0.05 && h < 3) dragonTopY = h;
    } catch (e) { console.warn('Gagal mengukur naga:', e); }
    return dragonTopY;
  }

  function openAR(payload) {
    currentPayload = payload;
    replyAllowed = payload && payload.from && (payload.from !== myName);

    // Minta izin gyro duluan selagi masih di dalam gesture user (wajib untuk iOS)
    const gyroReady = requestGyroPermission();

    $('#screen-chat').hidden = true;
    const wrapper = $('#scene-wrapper'); wrapper.style.visibility = 'visible'; wrapper.style.zIndex = '100';
    $('#ar-ui-container').hidden = false;
    $('#dragon-entity').setAttribute('visible', 'false'); $('#dragon-bubble').setAttribute('visible', 'false');
    window.speechSynthesis.cancel();
    $('#btnPlace').hidden = true; $('#btnReply').hidden = true; $('#btnBack').hidden = true;
    $('#arHint').hidden = false; $('#arHint').textContent = i18n[lang].arHintLoad;

    const scene = document.querySelector('a-scene');

    const goFallback = () => { gyroReady.then(startFallbackAR); };

    const tryWebXR = () => {
      if (!hasWebXR) return goFallback();
      AR.mode = 'webxr'; updateModeBadge();
      $('#arHint').textContent = i18n[lang].arHintScan;
      let ok = false;
      try {
        const p = scene.enterAR();
        if (p && p.then) p.then(() => { ok = true; }).catch(() => { AR.mode = null; goFallback(); });
      } catch (e) { AR.mode = null; return goFallback(); }
      // Kalau sesi WebXR gagal terbuka dalam 4 detik, pakai fallback
      setTimeout(() => { if (!scene.is('ar-mode') && !AR.active) { AR.mode = null; goFallback(); } }, 4000);
    };

    if (scene.hasLoaded) { tryWebXR(); } else { scene.addEventListener('loaded', tryWebXR); }
  }

  $('#btnPlace').onclick = () => {
    const reticle = document.getElementById('reticle');
    const dragon = document.getElementById('dragon-entity');
    const bubble = document.getElementById('dragon-bubble');

    if (reticle.getAttribute('visible')) {
      dragon.setAttribute('position', reticle.getAttribute('position'));
      dragon.setAttribute('visible', 'true');
      reticle.setAttribute('visible', 'false');
      $('#btnPlace').hidden = true;
      $('#arHint').hidden = true;

      const sfx = document.getElementById('spawnSound');
      if(sfx) { sfx.currentTime = 0; sfx.play().catch(e => console.log('Autoplay:', e)); }

      const burst = document.getElementById('magic-burst');
      const mRing = document.getElementById('magic-ring');
      const mSphere = document.getElementById('magic-sphere');

      if (burst && mRing && mSphere) {
        burst.setAttribute('visible', 'true');
        mRing.removeAttribute('animation__scale'); mRing.removeAttribute('animation__fade');
        mRing.setAttribute('animation__scale', {property: 'scale', from: '1 1 1', to: '12 12 12', dur: 800, easing: 'easeOutQuad'});
        mRing.setAttribute('animation__fade', {property: 'material.opacity', from: 1, to: 0, dur: 800, easing: 'easeOutQuad'});

        mSphere.removeAttribute('animation__scale'); mSphere.removeAttribute('animation__fade');
        mSphere.setAttribute('animation__scale', {property: 'scale', from: '1 1 1', to: '6 6 6', dur: 600, easing: 'easeOutCubic'});
        mSphere.setAttribute('animation__fade', {property: 'material.opacity', from: 0.8, to: 0, dur: 600, easing: 'easeOutCubic'});

        setTimeout(() => burst.setAttribute('visible', 'false'), 900);
      }

      if (currentPayload) {
        const textStr = currentPayload.text || "";
        const comic = bubble.components['comic-bubble'];
        if (comic) comic.render(textStr);

        const topY = measureDragonTop();
        bubble.setAttribute('position', `0 ${topY + 0.1} 0`);
        bubble.setAttribute('visible', 'true');
        bubble.removeAttribute('animation__pop');
        bubble.setAttribute('animation__pop', { property: 'scale', from: '0.15 0.15 0.15', to: '1 1 1', dur: 420, easing: 'easeOutBack' });

        if (autoDelete && currentPayload.id) {
            db.ref('messages/' + currentPayload.id).remove();
            deleteMsgByPayloadId(currentPayload.id);
        }

        speakAndPlay(currentPayload, () => {
           if (replyAllowed) $('#btnReply').hidden = false;
           $('#btnBack').hidden = false;
        });
      }
    }
  };

  const closeAR = (replyTarget = null) => {
    window.speechSynthesis.cancel();
    stopFallbackAR();
    const scene = document.querySelector('a-scene'); if (scene && scene.is('ar-mode')) { try { scene.exitVR(); } catch(e) {} }
    if (replyTarget) sessionStorage.setItem('sar_replyTo', replyTarget);
    window.location.replace(window.location.pathname);
  };

  $('#btnBackAR').onclick = () => closeAR(); $('#btnBack').onclick = () => closeAR();
  $('#btnReply').onclick = () => closeAR(currentPayload ? currentPayload.from : null);

  /* ================= PARALLAX LATAR (spatial feel) ================= */
  (function ambientParallax() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const stars = document.querySelector('#space .stars');
    const orbs = document.querySelectorAll('#space .orb');
    let tx = 0, ty = 0;
    const apply = () => {
      stars.style.transform = `translate3d(${tx * 14}px, ${ty * 14}px, 0)`;
      orbs.forEach((o, i) => { o.style.marginLeft = (tx * (7 + i * 4)) + 'px'; o.style.marginTop = (ty * (7 + i * 4)) + 'px'; });
    };
    window.addEventListener('deviceorientation', e => {
      if (AR.active || e.gamma === null) return;
      tx = Math.max(-1, Math.min(1, (e.gamma || 0) / 45));
      ty = Math.max(-1, Math.min(1, ((e.beta || 45) - 45) / 45));
      apply();
    });
    window.addEventListener('mousemove', e => {
      if (AR.active) return;
      tx = (e.clientX / window.innerWidth - .5) * 2;
      ty = (e.clientY / window.innerHeight - .5) * 2;
      apply();
    });
  })();

  /* ================= AUTO CLEANUP ================= */
  function cleanupOldMessages() {
    const dbRef = db.ref('messages'); const now = Date.now(); const cutoff = now - (24 * 60 * 60 * 1000);
    dbRef.orderByChild('t').endAt(cutoff).once('value').then(snapshot => {
      snapshot.forEach(childSnapshot => childSnapshot.ref.remove());
    }).catch(e => console.log(e));
  }

  /* ================= BOOTING ================= */
  applyLang(); cleanupOldMessages();
  const pendingReply = sessionStorage.getItem('sar_replyTo');
  if (pendingReply) { setReply(pendingReply); sessionStorage.removeItem('sar_replyTo'); toast(i18n[lang].toastReply + pendingReply); }
</script>
</body>
